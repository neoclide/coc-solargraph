name: Test

on:
  push:
  pull_request:

jobs:
  integration:
    name: ${{ matrix.editor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        editor: [nvim, vim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - name: Install editors
        run: sudo apt-get update && sudo apt-get install -y neovim vim
      - name: Install dependencies
        run: yarn install --frozen-lockfile
      - name: Run integration tests
        run: yarn run test:integration:${{ matrix.editor }}
