name: Daily release

on:
  schedule:
    # GitHub Actions cron uses UTC. Run daily away from the top of the hour.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
          registry-url: https://registry.npmjs.org

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Solargraph
        run: |
          gem install solargraph --no-document
          solargraph --version

      - name: Install dependencies
        run: npm ci

      - name: Install editors
        run: |
          sudo apt-get update
          sudo apt-get install -y neovim vim

      - name: Download coc.nvim release branch
        shell: bash
        run: |
          set -euo pipefail

          archive="$(mktemp "${RUNNER_TEMP}/coc.nvim.release.XXXXXX.tar.gz")"
          coc_path="$(mktemp -d "${RUNNER_TEMP}/coc.nvim.release.XXXXXX")"

          curl --fail --location --retry 3 \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GITHUB_TOKEN}" \
            --header "X-GitHub-Api-Version: 2026-03-10" \
            --output "$archive" \
            https://api.github.com/repos/neoclide/coc.nvim/tarball/release
          tar -xzf "$archive" --strip-components=1 -C "$coc_path"
          printf 'COC_TEST_COC_PATH=%s\n' "$coc_path" >> "$GITHUB_ENV"

      - name: Build
        run: npm run prepare

      - name: Test with Neovim
        run: npm run test:integration:nvim

      - name: Test with Vim
        run: npm run test:integration:vim

      - name: Plan release
        id: release
        shell: bash
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          current_version="$(node -p "require('./package.json').version")"

          # Select the newest SemVer release tag while retaining its original
          # name for git operations.
          previous_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' '[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -n 1)"
          if [[ -z "$previous_tag" ]]; then
            echo "::error::No SemVer release tag found; create the baseline release tag before running this workflow"
            exit 1
          fi
          previous_version="${previous_tag#v}"

          if ! git merge-base --is-ancestor "$previous_tag" HEAD; then
            echo "::error::Release tag $previous_tag is not an ancestor of HEAD"
            exit 1
          fi

          tag_exists() {
            git rev-parse --verify --quiet "refs/tags/$1^{commit}" >/dev/null \
              || git rev-parse --verify --quiet "refs/tags/v$1^{commit}" >/dev/null
          }

          if [[ "$current_version" != "$previous_version" ]]; then
            # A newer manifest version is an intentional manual bump. An older
            # version is a regression and must not be released.
            if [[ "$(printf '%s\n%s\n' "$current_version" "$previous_version" | sort -V | tail -n 1)" != "$current_version" ]]; then
              echo "::error::package.json version $current_version is older than latest release tag $previous_tag"
              exit 1
            fi
            if tag_exists "$current_version"; then
              echo "::error::Release tag $current_version already exists; inspect remote branch/tag divergence"
              exit 1
            fi
            echo "mode=release" >> "$GITHUB_OUTPUT"
            echo "version=$current_version" >> "$GITHUB_OUTPUT"
            echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commit_count="$(git rev-list --count "$previous_tag..HEAD")"
          if [[ "$commit_count" == "0" ]]; then
            if npm view "${package_name}@${current_version}" version --json >/dev/null 2>&1; then
              echo "No commits since $previous_tag; nothing to release."
              echo "mode=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            echo "Git release $current_version exists but npm does not have it; retrying publication only."
            echo "mode=publish-only" >> "$GITHUB_OUTPUT"
            echo "version=$current_version" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          published_version="$(npm view "$package_name" version)"
          if [[ "$published_version" != "$current_version" ]]; then
            echo "::error::package.json version $current_version does not match npm latest $published_version"
            exit 1
          fi
          echo "mode=release" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Update version and history
        if: steps.release.outputs.mode == 'release'
        id: prepare
        shell: bash
        env:
          PREVIOUS_TAG: ${{ steps.release.outputs.previous_tag }}
          MANIFEST_VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          previous_tag="$PREVIOUS_TAG"
          if [[ -n "$MANIFEST_VERSION" ]]; then
            # A manually bumped version is released as-is.
            version="$MANIFEST_VERSION"
          else
            version="$(npm version patch --no-git-tag-version)"
          fi
          version="${version#v}"

          if git rev-parse --verify --quiet "refs/tags/${version}^{commit}" >/dev/null \
            || git rev-parse --verify --quiet "refs/tags/v${version}^{commit}" >/dev/null; then
            echo "::error::Release tag $version already exists; inspect remote branch/tag divergence"
            exit 1
          fi

          release_notes="$(mktemp "${RUNNER_TEMP}/coc.solargraph.release-notes.XXXXXX")"
          updated_history="$(mktemp "${RUNNER_TEMP}/coc.solargraph.history-update.XXXXXX")"
          git log --format='- %s (%h)' "$previous_tag..HEAD" > "$release_notes"
          if [[ -s history.md ]]; then
            first_line="$(head -n 1 history.md)"
            if [[ "$first_line" == "# Change log" ]]; then
              {
                printf '%s\n\n' "$first_line"
                printf '## %s\n\n' "$version"
                cat "$release_notes"
                printf '\n'
                tail -n +2 history.md
              } > "$updated_history"
            else
              {
                printf '## %s\n\n' "$version"
                cat "$release_notes"
                printf '\n'
                cat history.md
              } > "$updated_history"
            fi
          else
            {
              printf '# Change log\n\n'
              printf '## %s\n\n' "$version"
              cat "$release_notes"
            } > "$updated_history"
          fi
          mv "$updated_history" history.md

          npm pack --dry-run

          untracked="$(git ls-files --others --exclude-standard)"
          if [[ -n "$untracked" ]]; then
            echo "::error::git commit -a would omit untracked files:"
            printf '%s\n' "$untracked"
            exit 1
          fi

          git diff --check
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit, tag, and push
        if: steps.release.outputs.mode == 'release'
        shell: bash
        env:
          VERSION: ${{ steps.prepare.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          source_head="$(git rev-parse HEAD)"
          git fetch --quiet origin "$DEFAULT_BRANCH"
          remote_head="$(git rev-parse FETCH_HEAD)"
          if [[ "$remote_head" != "$source_head" ]]; then
            echo "::error::Default branch advanced during this run; retry from $remote_head"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -a -m "Release $VERSION"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push --tags
          git push

      - name: Publish to npm
        if: steps.release.outputs.mode == 'release' || steps.release.outputs.mode == 'publish-only'
        run: npm publish
