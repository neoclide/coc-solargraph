name: CI

on:
  push:
  pull_request:

jobs:
  integration:
    name: ${{ matrix.editor }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        editor: [nvim, vim]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
      - name: Install Solargraph
        run: |
          gem install solargraph --no-document
          solargraph --version
      - name: Install editors
        run: sudo apt-get update && sudo apt-get install -y neovim vim
      - name: Install dependencies
        run: npm ci
      - name: Type check and run unit tests
        run: npm run lint && npm run test:unit
      - name: Run integration tests
        run: npm run test:integration:${{ matrix.editor }}
